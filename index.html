<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victoria &amp; Micah — Save the Date</title>
<meta name="description" content="Save the date for Victoria &amp; Micah's wedding.">
<link rel="preload" href="assets/font/BradfordLL-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/font/BradfordLL-Light.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="hero" aria-label="Victoria and Micah">
  <div class="hero__stage">
    <canvas id="hero-canvas"></canvas>
    <div class="hero__overlay">
      <h1 class="visually-hidden">Victoria &amp; Micah</h1>
      <p class="hero__cue" aria-hidden="true"><span>Scroll</span></p>
    </div>
  </div>
</section>

<main>

  <header class="rsvp-copy">
    <p class="rsvp-copy__kicker write-on">Save the Date</p>
    <p class="rsvp-copy__date write-on">Sept. 25, 2027</p>
    <p id="deadline-text" class="deadline-text">Save the date. Please kindly reply soon.</p>
  </header>

  <section class="rsvp">
    <form id="rsvp-form" novalidate>
      <div class="field-row">
        <div class="field">
          <label class="visually-hidden" for="first-name">First name</label>
          <input type="text" id="first-name" name="firstName" placeholder="First name" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label class="visually-hidden" for="last-name">Last name</label>
          <input type="text" id="last-name" name="lastName" placeholder="Last name" autocomplete="family-name" required>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="no-btn" class="btn btn-no">Sorry, can't make it</button>
        <button type="button" id="yes-btn" class="btn btn-yes">Yes, save the date</button>
      </div>

      <p id="form-status" role="status" aria-live="polite"></p>
    </form>

    <div id="rsvp-done" class="rsvp-done" hidden>
      <p id="rsvp-done-copy" class="rsvp-done__copy"></p>

      <div id="calendar-actions" class="calendar-actions" hidden>
        <p class="calendar-actions__label">Add it to your calendar</p>
        <a id="cal-google" class="cal-btn" target="_blank" rel="noopener">Google Calendar</a>
        <a id="cal-ics" class="cal-btn" download="victoria-and-micah-save-the-date.ics">Apple, Outlook &amp; others (.ics)</a>
      </div>

      <button type="button" id="rsvp-redo" class="linkish">Picked the wrong button? Reply again</button>
    </div>
  </section>

</main>

<script type="module" src="hero.js"></script>
<script src="script.js"></script>
</body>
</html>
